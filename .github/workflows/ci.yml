name: CI

on:
  push:
    branches: [main, staging]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm types:check
      # Prerenders every page: fails on a broken MDX page or a missing component.
      - run: pnpm build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: The static site is complete
        run: |
          cd build/client
          for f in index.html pt-br/index.html docs/index.html pt-br/docs/index.html 404/index.html api/search .htaccess; do
            test -s "$f" || { echo "::error::missing $f"; exit 1; }
          done
          echo "$(find . -name index.html | wc -l) pages"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: site
          path: build/client
          include-hidden-files: true
          retention-days: 7

  # brokspace.org on Hostinger serves the `hostinger` branch as static files
  # (README, Deploy). Every release (push to main) that passes `check` replaces
  # its content with the new build.
  publish-hostinger:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-hostinger
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: ${{ runner.temp }}/site
      - name: Commit the site to the hostinger branch
        env:
          SITE: ${{ runner.temp }}/site
        run: |
          set -euo pipefail
          test -f "$SITE/index.html" && test -f "$SITE/.htaccess" && test -f "$SITE/404/index.html"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin hostinger >/dev/null; then
            git switch -q hostinger
          else
            git switch -q --orphan hostinger
          fi
          # Replace the tree with the new build (removed pages disappear too), keep .git.
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$SITE"/. .
          cat > DEPLOY.md <<NOTE
          Built from ${GITHUB_SHA} of main by the CI workflow. Do not edit this branch: Hostinger deploys it
          to public_html as is. Source: https://github.com/${GITHUB_REPOSITORY}/tree/${GITHUB_SHA}
          NOTE
          git add -A
          if git diff --cached --quiet; then
            echo "The site did not change; nothing to deploy."
            exit 0
          fi
          git commit -q -m "deploy: ${GITHUB_SHA::7}"
          git push -q origin hostinger
          echo "Deployed ${GITHUB_SHA::7} to the hostinger branch."
