name: CI

on:
  push:
    branches: [main, staging]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm types:check
      # Prerenders every page: fails on a broken MDX page or a missing component.
      - run: pnpm build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: The static site is complete
        run: |
          cd build/client
          for f in index.html pt-br/index.html docs/index.html pt-br/docs/index.html 404/index.html api/search .htaccess; do
            test -s "$f" || { echo "::error::missing $f"; exit 1; }
          done
          echo "$(find . -name index.html | wc -l) pages"
